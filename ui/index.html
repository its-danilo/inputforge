<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InputForge</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="backdrop" aria-hidden="true"><div class="grid"></div></div>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 32 32"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent2)"/></linearGradient></defs>
          <path d="M5 13h17l5-4v6l-4 3H17l2 5h4v3H9v-3h4l2-5H9c-2.5 0-4-1.6-4-3.5z" fill="url(#lg)"/>
          <path d="M14 2l1.2 3.3L18.5 6l-3.3 1.2L14 10.5l-1.2-3.3L9.5 6l3.3-1.2z" fill="var(--fg)" opacity=".9"/>
        </svg>
      </div>
      <div class="wordmark">Input<span>Forge</span></div>
    </div>

    <nav class="nav" id="nav"></nav>

    <div class="side-section">
      <div class="side-title">Perfis <button class="icon-btn sm" data-action="new-profile" title="Novo perfil"><svg><use href="#i-plus"/></svg></button></div>
      <div id="profile-list" class="profile-list"></div>
    </div>

    <div class="side-foot" id="side-foot"></div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="crumbs" id="crumbs"></div>
      <div class="top-actions">
        <div class="engine-chip" id="engine-chip"></div>
        <button class="icon-btn" data-action="panic" title="Parar tudo (pânico)"><svg><use href="#i-octagon"/></svg></button>
        <button class="icon-btn" data-action="close" title="Fechar"><svg><use href="#i-x"/></svg></button>
      </div>
    </header>
    <div class="view" id="view"></div>
  </main>
</div>

<div class="drawer-scrim" id="scrim" data-action="close-drawer"></div>
<aside class="drawer" id="drawer" aria-hidden="true"></aside>
<div class="modal-wrap" id="modal"></div>
<div class="toasts" id="toasts"></div>
<div class="banner" id="banner"></div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h5v-6h4v6h5V9.5"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>

    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5z"/></symbol>

    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="2.5"/><path d="M16 8V5.5A2.5 2.5 0 0 0 13.5 3h-8A2.5 2.5 0 0 0 3 5.5v8A2.5 2.5 0 0 0 5.5 16H8"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.4 3.6a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4z"/></symbol>

    <symbol id="i-rec" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4" fill="currentColor"/></symbol>
